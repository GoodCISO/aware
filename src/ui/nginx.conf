server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: every non-API path serves the React shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets are content-hashed by react-scripts.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 2026-11-10 (scribe): the UI's API base is now same-origin relative
    # ('/api' — src/ui/src/constants/index.js), so the browser sends every
    # API call to this origin and nginx forwards it to the v2 gateway.
    #
    # The upstream is the gateway (aware-2-gateway), not the v1
    # aware-backend: the compliance and audit routes the UI reads are
    # mounted on the gateway. The coordinator does not serve them.
    location /api/ {
        proxy_pass http://gateway:18080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The gateway's own audit/compliance reads can take a moment on a
        # cold chain; the default 60s is well inside nginx's 60s default
        # proxy timeout, so raise the read timeout rather than the
        # request timeout.
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://gateway:18080/health;
        proxy_set_header Host $host;
    }
}

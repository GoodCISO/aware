server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: every non-API path serves the React shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets are content-hashed by react-scripts.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 2026-11-10 (scribe): the upstream is the gateway (aware-2-gateway),
    # not the v1 aware-backend: the compliance and audit routes the UI
    # reads are mounted on the gateway. The coordinator does not serve
    # them.
    #
    # STALE DNS FIX. `proxy_pass http://gateway:18080/api/` makes nginx
    # resolve "gateway" ONCE at config load and cache the resulting IP
    # for the lifetime of the worker. Docker assigns a new IP whenever the
    # gateway container is recreated, so the cached address goes stale and
    # every proxied request fails with:
    #
    #   connect() failed (111: Connection refused) while connecting to
    #   upstream ... upstream: "http://172.21.0.4:18080/api/compliance/posture"
    #
    # while the gateway was actually live on 172.21.0.6. The 502 is a
    # client-side artefact, not a gateway failure.
    #
    # The fix is to put the hostname in a variable: nginx then resolves it
    # per request instead of caching it, and `resolver` points at Docker's
    # embedded DNS (127.0.0.11). `set` + variable `proxy_pass` also keeps
    # the request URI, so the /api/ prefix behaves as before.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $aware_gateway http://gateway:18080;
        proxy_pass $aware_gateway$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The gateway's own audit/compliance reads can take a moment on a
        # cold chain; the default 60s is well inside nginx's 60s default
        # proxy timeout, so raise the read timeout rather than the
        # request timeout.
        proxy_read_timeout 120s;
    }

    location /health {
        set $aware_gateway_health http://gateway:18080;
        proxy_pass $aware_gateway_health/health;
        proxy_set_header Host $host;
    }
}

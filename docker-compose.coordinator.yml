# docker-compose.coordinator.yml — AWARE 2.0 coordinator stack
# Per ADR (internal) Phase 1: 7-service topology, of which 5 run locally and 2 are
# placeholder external services for Phase 3 (Modal).
#
# This file is ADDITIVE — it does NOT replace the v1 docker-compose.yml
# (which still runs the v1.0.0 backend + frontend). The v1 stack continues
# to run on ports 3000/3001/80/443/5001; the v2 stack lives in the 18xxx range.
#
# Build with:
#   DOCKER_BUILDKIT=1 docker compose \
#     -f docker-compose.coordinator.yml \
#     -p aware-2 \
#     up -d --build
#
# rl-pipeline source is the repo's OWN vendored copy
# (backend/heavy-think/src), COPYed into the image by the Dockerfile.
# The build does NOT mount the local working copy from the host, and it
# does NOT clone rl-pipeline from an external git server — there is no
# tag to bump, so the deployed judge path cannot drift away from the
# reviewed tree. The coordinator's boot check
# (src/config/rl-pipeline-build.cjs) compares the live tree against the
# sha256 manifest the build writes. See AWARE card t_091892e3.
#
# (Before t_091892e3: rl-pipeline was cloned at a pinned tag
# AWARE_RL_PIPELINE_TAG=v0.2.2 from AWARE_RL_PIPELINE_REPO. That pin was
# the direct cause of the drift — the deployed verify.js had no
# `llm-judge` while config/rlm.yaml named it as the default method, so
# the declared default never ran once.)
#
# Tear down:
#   docker compose -f docker-compose.coordinator.yml -p aware-2 down
#
# Verify:
#   curl -sS http://127.0.0.1:18080/health  # gateway
#   curl -sS http://127.0.0.1:18081/health  # coordinator
#   curl -sS http://127.0.0.1:18081/version # coordinator identity
#
# [date-redacted]: Ollama sidecar REMOVED. AWARE_MODE=online runs the
# coordinator on the primary LLM provider only. See docs/adr/ADR (internal) amendment at
# the bottom of that file (and the bring-up script) for the
# rationale. The previous ollama-sidecar smoke-test line
# (curl http://127.0.0.1:11434/api/tags) is no longer applicable.

name: aware-2

# ─── Networks ──────────────────────────────────────────────────────
networks:
  aware-2:
    driver: bridge
    name: aware-2

# ─── Volumes (persistent) ──────────────────────────────────────────
volumes:
  aware-2-postgres-data:
    name: aware-2-postgres-data
  aware-2-redis-data:
    name: aware-2-redis-data
  # C-step finding #16: shared audit-data volume. Both coordinator
  # (writer) and gateway (reader via /api/audit/*) mount this so the
  # gateway's audit HTTP API surfaces decisions the coordinator
  # appended to /data/audit/decision-chain.jsonl. Without the shared
  # volume, the gateway would read an empty chain (or fail to read
  # entirely if AUDIT_DIR doesn't exist in its container filesystem).
  # C-step finding #17: AWARE_AUDIT_RETENTION_DAYS governs how long
  # entries survive here; see scripts/audit-retention-cleanup.js
  # and docs/sop/audit-retention.md for the cleanup contract.
  # 2026-11-10 (scribe): compliance state (assessments + collected
  # evidence) lives in its own volume rather than in the audit volume.
  # The audit volume is mounted READ-ONLY in the gateway so a compromised
  # gateway cannot rewrite the audit trail; writing compliance state there
  # failed with EROFS. Both the gateway and the coordinator run the
  # compliance engine, so both need read-write access to this volume.
  aware-2-compliance-data:
    name: aware-2-compliance-data

  aware-2-audit-data:
    name: aware-2-audit-data
  # aware-2-ollama-models REMOVED [date-redacted]: Ollama sidecar deprecated.
  # Coordinator now runs AWARE_MODE=online on the primary LLM provider only. See ADR (internal)
  # amendment at the bottom of that file. The named volume can be
  # cleaned up with:
  #   docker volume rm aware-2-ollama-models
  # aware-2-preference-pairs removed (Phase 2.4): the named volume was
  # mounted at an image-baked path but the AWARE process (running as
  # `aware`, with HOME=/home/aware) writes to a different home-relative
  # path. The coordinator service now uses a host bind mount to that
  # path instead. The orphan Docker volume can be removed with:
  #   docker volume rm aware-2-preference-pairs
  # Note (2026-06-14): the host bind mount to /data/awareness-pairs
  # also doesn't work in this Docker Desktop environment — bind mounts
  # from redacted-host-config/ into containers silently fail to populate.
  # The trainer (aware-2-trainer) reads via aware-2-pairs-data named
  # volume, so the host doesn't need direct access. See
  # docs/sop/sop-phase-2-4-data-flywheel.md
  # (added in this slice) for the full bind-mount investigation +
  # named-volume fallback rationale.
  aware-2-pairs-data:
    name: aware-2-pairs-data
  aware-2-trainer-data:
    name: aware-2-trainer-data

# ─── Services ──────────────────────────────────────────────────────
services:

  # ─── 1. Gateway ───────────────────────────────────────────────
  # Thin BFF/proxy in front of the coordinator. Adds helmet, cors,
  # rate-limit, and a per-request X-Request-Id; forwards /coordinate,
  # /health, and /version to the coordinator. Gateway kill-switch
  # (AWARE_GATEWAY_KILL_SWITCH) takes precedence over the coordinator
  # kill-switch (defense in depth). Lives behind `profiles: ["full"]`
  # so the bring-up script's default 4-service stack works without it.
  # [date-redacted]: rebuilt as 0.4.0-phase4-complete-ollama-removed.
  # Picks up LLM_API_KEY env var name (was PROVIDER_API_KEY in 0.2.0
  # image), plus ADR (internal) Repair 1 trainer-config defaults (filterRule
  # min_score_gap, filterMinGap 0.20). See ADR (internal) amendment.
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    image: aware-gateway:0.2.0-ollama-removed
    container_name: aware-2-gateway
    profiles: ["full"]
    ports:
      - "18080:18080"
    environment:
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=18080
      - COORDINATOR_URL=http://coordinator:8080
      - AWARE_GATEWAY_KILL_SWITCH=${AWARE_GATEWAY_KILL_SWITCH:-0}
      - GATEWAY_PROXY_TIMEOUT_MS=120000
      # C-step finding #16: the gateway reads the audit chain from
      # /data/audit (mounted via aware-2-audit-data below). The
      # AUDIT_DIR var tells decision-logger.js where to read from.
      # The coordinator (writer) must share this path.
      - AUDIT_DIR=/data/audit
      # C-step finding #15: explicit CORS allowlist for the v2 gateway.
      # Comma-separated. Defaults to localhost:3001 if unset.
      - AWARE_GATEWAY_ALLOWED_ORIGINS=${AWARE_GATEWAY_ALLOWED_ORIGINS:-http://localhost:3001}
      # SEC-002. The gateway mirrors the coordinator's bearer token so it can
      # call /coordinate and /budget/status upstream (the coordinator's auth
      # gate rejects unauthenticated calls with 401).
      #
      # The gateway boots with NODE_ENV=production (Dockerfile.gateway), and
      # config.validate() fails closed when this token is unset or shorter
      # than 32 chars. Without it the gateway cannot start at all - it
      # crash-loops on every boot with:
      #   Error: Config: AWARE_COORDINATOR_TOKEN is required and must be >=32
      #   chars when NODE_ENV=production (SEC-002)
      #
      # ADR-083: the token is NOT declared here. Compose merges
      # `environment:` and `env_file:` into one container environment, and
      # `environment:` WINS on every key it names. Declaring
      # `AWARE_COORDINATOR_TOKEN=${AWARE_COORDINATOR_TOKEN:-}` here therefore
      # did not merely duplicate the store's value - it OVERRODE it, so the
      # env_file entry below was dead code for this key. The credential store
      # is now the single source of truth; see the env_file block below.
    # The gateway reads the same credential store as the coordinator.
    #
    # ADR-083: `required` now interpolates to `true` by default. With
    # `required: false` a missing store produced a container that started and
    # then crash-looped on the SEC-002 token check - a restart loop that named
    # the token, not the missing FILE. With `required: true` Compose refuses
    # to create ANY container and prints the resolved absolute path of the
    # file it could not find, which is the actionable message.
    #
    # The path is operator-supplied via AWARE_CREDENTIALS_FILE and defaults
    # to the canonical store location. An operator who deliberately wants the
    # old soft behaviour (offline / CI bring-up with no credentials) sets
    # AWARE_CREDENTIALS_REQUIRED=false; the default is loud.
    env_file:
      - path: ${AWARE_CREDENTIALS_FILE:-${HOME}/.aware/credentials.env}
        required: ${AWARE_CREDENTIALS_REQUIRED:-true}
    volumes:
      # C-step finding #16: read-only mount of the shared audit-data
      # volume. The gateway never writes here — only reads, via the
      # audit HTTP API mounted at /api/audit/*. Read-only so a
      # compromised gateway can't tamper with the chain.
      - aware-2-audit-data:/data/audit:ro
      # Compliance state (assessments + evidence). Read-write: the
      # gateway runs the compliance engine and must persist what it
      # collects. Separate from the audit volume, which stays :ro
      # here so the gateway cannot rewrite the audit trail.
      - aware-2-compliance-data:/data/compliance
    depends_on:
      coordinator:
        condition: service_healthy
    networks:
      - aware-2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18080/health"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

  # ─── 2. Coordinator ───────────────────────────────────────────
  # The Phase 1 deliverable. Built from Dockerfile.coordinator.
  # Brings its own /health endpoint (used by the Docker HEALTHCHECK).
  # [date-redacted]: rebuilt as 0.4.0-phase4-complete-ollama-removed.
  # Picks up LLM_API_KEY env var name (was PROVIDER_API_KEY in 0.2.0
  # image), plus ADR (internal) Repair 1 trainer-config defaults (filterRule
  # min_score_gap, filterMinGap 0.20). See ADR (internal) amendment.
  coordinator:
    build:
      context: .
      dockerfile: Dockerfile.coordinator
      # 2026-11-10 (scribe): the build no longer requests `network: host`.
      # It used to, because AWARE_RL_PIPELINE_REPO pointed at 127.0.0.1 and
      # a BuildKit build container cannot see the host's loopback. That
      # required the insecure entitlement network.host, which needs a
      # dedicated buildx builder AND a client-side --allow flag that
      # `docker compose build` has no way to pass - so the build failed
      # with "additional privileges requested".
      #
      # 2026-11-17 (t_091892e3): the rl-pipeline build args are GONE.
      # The image no longer clones rl-pipeline from an external git server at
      # a pinned tag — it ships the repo's own vendored copy
      # (backend/heavy-think/src, see Dockerfile.coordinator), so there is
      # no tag to bump and no second implementation to drift. The old pin
      # was the direct cause of the drift: the deployed verify.js had no
      # `llm-judge` while config/rlm.yaml named it as the default method.
      #
      # With no git remote to reach, the build needs no network entitlement
      # at all — the default bridge network is sufficient.
    # 2026-11-19 (t_3212eebd): bumped to 0.4.7-judge-family-deployed. The
    # 0.4.6 image shipped the PRE-t_8b44fe9d judge-family resolver, so the
    # config-time guard ran the MIRROR while the runtime guard ran the
    # canonical module -- two independent implementations of the same rule
    # in production. 0.4.7 resolves /app/rl-pipeline/src/judge-family.js.
    # 2026-11-19 (t_9be93b08): bumped to 0.4.8-served-model-deployed. The
    # 0.4.7 image shipped the PRE-t_49d955b7 judge client, so the pair
    # record named the model that was ASKED FOR rather than the model that
    # SERVED, and the Ollama judge path ignored the per-call override
    # entirely. 0.4.8 ships the served-model contract.
    # 2026-11-19 (t_92708010): bumped to 0.4.9-config-guard-deployed. The
    # 0.4.8 image shipped the PRE-t_866475db config layer, so the boot-time
    # judge-independence refusal applied to AWARE_JUDGE_MODEL only.
    # AWARE_JUDGE_OLLAMA_MODEL -- the same kind of judge, named by a
    # different env var -- was exempt from the model-FAMILY refusal, so a
    # same-family Ollama judge was ACCEPTED at boot and the operator was
    # told the configuration was valid. 0.4.9 ships the config-time guard.
    image: aware-coordinator:0.4.9-config-guard-deployed
    container_name: aware-2-coordinator
    ports:
      - "18081:8080"
    environment:
      # SEC-007: bind coordinator to 0.0.0.0 inside the container.
      # The 18081:8080 port mapping above exposes 8080 on the host; with
      # 0.0.0.0 binding the docker-proxy can DNAT host:18081 traffic to
      # container:8080 (the previous 127.0.0.1 binding broke host access
      # because docker-proxy connects via the container bridge IP, not
      # loopback). Only the published port path reaches the coordinator
      # from outside the docker network. Operators who want to harden
      # further can drop the ports: mapping and rely on sibling-container
      # network access only.
      - COORDINATOR_HOST=${COORDINATOR_HOST:-0.0.0.0}
      - COORDINATOR_PORT=8080
      # [date-redacted]: AWARE_MODE=online (was hybrid). Ollama sidecar
      # removed; coordinator now runs on the primary LLM provider only. See ADR (internal)
      # amendment. If the primary LLM provider is unavailable, /coordinate returns
      # 503 (single-client-mode behavior). The previous offline
      # fallback to Ollama no longer exists.
      - AWARE_MODE=${AWARE_MODE:-online}
      - AWARE_REQUEST_TIMEOUT_MS=${AWARE_REQUEST_TIMEOUT_MS:-120000}
      - AWARE_REQUEST_COST_CAP_USD=${AWARE_REQUEST_COST_CAP_USD:-1.0}
      - AWARE_KILL_SWITCH=${AWARE_KILL_SWITCH:-0}
      # [date-redacted]: API key wiring. The canonical env var is
      # PROVIDER_API_KEY. We also pass through LLM_API_KEY for
      # backward compat with operators still using the legacy name —
      # the config module reads PROVIDER_API_KEY first and falls back
      # to LLM_API_KEY with a soft deprecation warning.
      #
      # ADR-083: the provider key, the minimax key, the provider host and
      # the coordinator token are NOT declared here. Compose merges
      # `environment:` and `env_file:` into one container environment, and
      # `environment:` WINS on every key it names. Declaring
      # `LLM_API_KEY=${LLM_API_KEY:-}` here therefore did not merely
      # duplicate the credential store's value - it OVERRODE it with the
      # empty string, so the env_file entry below was dead code for this
      # key. Measured on 2026-11-24 with the store present, readable and
      # carrying the key, and the shell unset: the coordinator received
      # LLM_API_KEY="" and the container crash-looped on the online-mode
      # guard. The credential store is now the single source of truth for
      # these keys; see the env_file block below.
      #
      # The operator no longer has to source the credential file into their
      # shell before invoking docker compose. That out-of-band step was
      # undocumented, was silently skippable, and was the actual cause of
      # the outage.
      #
      # 2026-11-10 (scribe): the provider model was previously hard-coded
      # to 'MiniMax-M3' inside the pinned rl-pipeline dependency and could
      # only be changed by republishing that library. rl-pipeline's client
      # already honours options.model; AWARE now passes it through, and
      # this env var selects it. MiniMax-M3.1-Flash is the default.
      #
      # ADR-083: AWARE_PROVIDER_MODEL and AWARE_REQUEST_COST_CAP_USD are
      # ALSO store-owned (the canonical store carries both) but are NOT
      # removed here, because their compose defaults are non-secret
      # operator-tunable settings, not secrets. See the env_file block for
      # the precedence rule.
      - AWARE_PROVIDER_MODEL=${AWARE_PROVIDER_MODEL:-MiniMax-M3.1-Flash}
      # [date-redacted]: OLLAMA_URL re-enabled and pointed at the host's
      # macOS Ollama daemon. The container-side default of 127.0.0.1:11434
      # points at the container's own loopback (no ollama runs there);
      # the previous ollama-sidecar service was removed in the
      # ollama-removed image line. host.docker.internal is the Docker-
      # blessed way to reach the macOS host from a container (works
      # without extra configuration; Colima adds the magic hostname).
      # Override via the operator's runtime env file to retarget a
      # different Ollama install.
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      # [date-redacted]: LoRA reloader disabled. It depends on the Ollama
      # /api/create endpoint to register LoRA adapters with the
      # local model daemon. Without Ollama, the reloader would
      # repeatedly fail. Re-enable only if Ollama is reintroduced.
      - AWARE_LORA_RELOADER_ENABLED=${AWARE_LORA_RELOADER_ENABLED:-false}
      - AWARE_DB_HOST=postgres
      - AWARE_DB_PORT=5432
      - AWARE_DB_DATABASE=${POSTGRES_DB:-aware2}
      - AWARE_DB_USER=${POSTGRES_USER:-aware}
      - AWARE_DB_ENABLED=${AWARE_DB_ENABLED:-1}
      # Phase 2.4 (ADR (internal) 618-627) preference-pair output directory.
      # Must match the volume mount point in the volumes: block below
      # (named volume aware-2-pairs-data → /data/awareness-pairs). The
      # path is intentionally not under the home directory because the
      # image bakes a home-relative preference-pairs path at build time,
      # which would shadow a host bind mount to that path.
      # Phase 1 had the implicit default home-relative path which is why
      # the trainer's pair ingestion has never seen any live data — the
      # live writes were landing in the image's ephemeral dir, not the
      # bind-mounted host dir. Phase 2.4 swaps to a named volume
      # (aware-2-pairs-data) that the trainer reads via the same mount;
      # host bind mounts from redacted-host-config/ into containers silently
      # fail to populate in this Docker Desktop environment, so the named
      # volume is the only working path.
      - AWARE_PAIRS_DIR=/data/awareness-pairs
      # The coordinator authenticates with the same password the postgres
      # service was initialized with (see POSTGRES_PASSWORD below).
      #
      # ADR-083: this key STAYS in `environment:`, unlike the provider key
      # and the bearer token. The postgres password is not a runtime secret -
      # it is baked into the postgres data volume at INIT time, so it cannot
      # be re-read from the credential store without invalidating the
      # password the existing volume was created with. Moving it to
      # `env_file:` would silently change the coordinator's password to the
      # store's value while the live volume kept its original one, and the
      # coordinator would fail every query with an auth error.
      #
      # The invariant that matters is that this expression is BYTE-IDENTICAL
      # to the postgres service's POSTGRES_PASSWORD below. They must be
      # changed together or not at all. The guard test
      # (test/unit/scripts/compose-credential-contract.test.js) asserts it.
      - AWARE_POSTGRES_PASSWORD=${AWARE_DB_PWD:-dev-only-pwd}
      # [date-redacted]: SEC-002. Bearer token
      # required for /coordinate + /budget/status. Fail-closed at boot in
      # NODE_ENV=production if unset or shorter than 32 chars (config.validate()).
      # The gateway must mirror this token in its outbound Authorization header.
      # ADR-083: supplied by the credential store (env_file below) - NOT
      # declared here, because `environment:` would override the store.
      #
      # C-step finding #16: AUDIT_DIR is the path where decision-logger.js
      # writes the hash-chained audit log (decision-chain.jsonl). It must
      # match the gateway's AUDIT_DIR so the gateway's /api/audit/* API
      # reads what the coordinator writes. The shared mount is
      # aware-2-audit-data below.
      - AUDIT_DIR=/data/audit
      # C-step finding #17: retention policy for audit log + Postgres
      # aware_conversations. Default 2555 days = 7 years (DORA Art.26
      # baseline). See scripts/audit-retention-cleanup.js + docs/sop/audit-retention.md
      - AWARE_AUDIT_RETENTION_DAYS=${AWARE_AUDIT_RETENTION_DAYS:-2555}
    # The upstream LLM API key is intentionally NOT hardcoded. The
    # compose file reads the env var from a credential-store file
    # whose path is operator-supplied via the `AWARE_CREDENTIALS_FILE`
    # env var (default: the canonical store under the operator's home).
    #
    # ADR-083: `required` now interpolates to `true` by default, and the
    # path default resolves to a real location. The previous
    # `required: false` + placeholder path combination meant a fresh
    # checkout produced a container that started and then crash-looped on
    # the online-mode guard - the error named the KEY, not the missing
    # FILE, and the operator had to guess which file to create.
    #
    # With `required: true` Compose refuses to create ANY container and
    # prints the resolved absolute path of the file it could not find:
    #   env file /Users/<you>/.aware/credentials.env not found: stat ...
    # which is the actionable message. An operator who deliberately wants
    # the old soft behaviour (offline / CI bring-up with no credentials)
    # sets AWARE_CREDENTIALS_REQUIRED=false; the default is loud.
    #
    # PRECEDENCE (ADR-083): Compose merges `environment:` and `env_file:`
    # into one container environment, and `environment:` WINS on every key
    # it names. Every key the store owns is therefore DELIBERATELY ABSENT
    # from the `environment:` block above - LLM_API_KEY, MINIMAX_API_KEY,
    # AWARE_COORDINATOR_TOKEN, AWARE_POSTGRES_PASSWORD. Non-secret
    # tunables that the store also carries (AWARE_MODE,
    # AWARE_REQUEST_COST_CAP_USD, AWARE_PROVIDER_MODEL) are declared here
    # with their compose defaults, so the compose file remains the
    # readable source for those and the store only overrides them if the
    # operator removes the declaration.
    env_file:
      - path: ${AWARE_CREDENTIALS_FILE:-${HOME}/.aware/credentials.env}
        required: ${AWARE_CREDENTIALS_REQUIRED:-true}
    volumes:
      # Named volume for preference-pair output. Phase 1 used a bind
      # mount from redacted-host-config/meta-rl-pipeline/preference-pairs but bind mounts
      # from redacted-host-config/ into containers silently fail to populate.
      # The named volume lives at
      # /var/lib/docker/volumes/aware-2-pairs-data/_data; the trainer
      # (aware-2-trainer) reads via the same named volume mount. The
      # AWARE_PAIRS_DIR env var below tells the coordinator to write
      # to /data/awareness-pairs, the path the named volume mounts at.
      # The previous named volume (`aware-2-preference-pairs`) was
      # mounted at <image-baked-path> but the AWARE process (running as
      # `aware`, with HOME=/home/aware) wrote to <image-baked-home-path>
      # — so the volume was dead weight. Phase 2.4 data flywheel unblock.
      - aware-2-pairs-data:/data/awareness-pairs
      # C-step finding #16: read-write mount of the shared audit-data
      # volume. The coordinator appends to /data/audit/decision-chain.jsonl
      # after each successful /coordinate. The gateway reads the same
      # path via its own (read-only) mount so the /api/audit/* API
      # surfaces real decisions.
      - aware-2-audit-data:/data/audit
      # Compliance state volume, shared read-write with the gateway.
      - aware-2-compliance-data:/data/compliance
    depends_on:
      postgres:
        condition: service_healthy
      # [date-redacted]: ollama-sidecar dependency REMOVED. Ollama sidecar
      # no longer exists. The coordinator runs in AWARE_MODE=online
      # on the primary LLM provider only — no second-tier backend to wait for.
      # ollama-sidecar:
      #   condition: service_healthy
    networks:
      - aware-2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ─── 3. Ollama sidecar ───────────────────────────────────────
  # REMOVED [date-redacted]. AWARE 2.0 now runs on the primary LLM provider only
  # (AWARE_MODE=online). See ADR (internal) amendment for the rationale.
  # Previous block (kept here commented for archaeology):
  #
  #   # ─── 3. Ollama sidecar ───────────────────────────────────────
  #   # Local model fallback. Pre-pulled models (qwen2.5:7b, etc.) live in
  #   # the aware-2-ollama-models volume. Override the default pull model
  #   # with AWARE_OLLAMA_PULL=llama3.2:3b, or set to "none" to skip the pull.
  #   ollama-sidecar:
  #     image: ollama/ollama:0.5.7
  #     container_name: aware-2-ollama
  #     ports:
  #       - "11434:11434"
  #     environment:
  #       - OLLAMA_KEEP_ALIVE=24h
  #       - OLLAMA_HOST=0.0.0.0:11434
  #     volumes:
  #       - aware-2-ollama-models:/root/.ollama
  #     networks:
  #       - aware-2
  #     restart: unless-stopped
  #     healthcheck:
  #       test: ["CMD", "ollama", "list"]
  #       interval: 15s
  #       timeout: 5s
  #       start_period: 30s
  #       retries: 5
  #     entrypoint: ["/bin/sh", "-c"]
  #     command:
  #       - |
  #         ollama serve &
  #         OLLAMA_PID=$$!
  #         for i in $$(seq 1 30); do
  #           if wget -qO- http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then break; fi
  #           sleep 1
  #         done
  #         if [ "$${AWARE_OLLAMA_PULL:-qwen2.5:7b}" != 'none' ]; then
  #           ollama pull "$${AWARE_OLLAMA_PULL:-qwen2.5:7b}"
  #         fi
  #         wait $$OLLAMA_PID
  #
  # To bring this back (e.g. for offline/air-gapped deployments):
  # 1. Restore the block above (uncomment).
  # 2. Restore the `aware-2-ollama-models` volume declaration.
  # 3. Restore the `coordinator.depends_on.ollama-sidecar` block.
  # 4. Restore the `coordinator.environment.OLLAMA_URL` line.
  # 5. Set `AWARE_MODE=offline` (or hybrid) in coordinator env.
  # 6. Set `AWARE_LORA_RELOADER_ENABLED=true` if you want live LoRA swap.

  # ─── 4. Postgres ─────────────────────────────────────────────
  # Session + preference-pair metadata (rl-pipeline already writes
  # JSONL to a volume; this is the structured metadata store).
  # Default password is for local dev only — override via the
  # AWARE_DB_PWD env var (see .env.example) in any non-dev deployment.
  #
  # ADR-083: this expression MUST stay byte-identical to the
  # coordinator's AWARE_POSTGRES_PASSWORD (see above). The two are a pair:
  # the postgres volume is initialised with this password, and the
  # coordinator authenticates with that same value. They are changed
  # together or not at all. The guard test
  # (test/unit/scripts/compose-credential-contract.test.js) asserts the
  # equality so the pair cannot drift.
  postgres:
    image: postgres:16-alpine
    container_name: aware-2-postgres
    ports:
      - "18432:5432"
    environment:
      - POSTGRES_DB=aware2
      - POSTGRES_USER=aware
      - POSTGRES_PASSWORD=${AWARE_DB_PWD:-dev-only-pwd}
    volumes:
      - aware-2-postgres-data:/var/lib/postgresql/data
    networks:
      - aware-2
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aware -d aware2"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  # ─── 5. Redis ────────────────────────────────────────────────
  # Cache + memory backend (Phase 5 N.O.M.A.D. uses Redis for memory).
  redis:
    image: redis:7-alpine
    container_name: aware-2-redis
    ports:
      - "18379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - aware-2-redis-data:/data
    networks:
      - aware-2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

  # ─── 7. trainer (Phase 3 — aware-trainer poller) ──────────────
  # The Node-based aware-trainer poller. Watches Postgres for new
  # preference pairs (the conversations table), submits DPO training
  # jobs to Modal, polls for completion, and atomically swaps the
  # active weight checkpoint.
  #
  # SECURITY:
  # - The Modal token is read from the credential store at runtime;
  #   it is NOT in this compose file. The env_file reference below
  #   uses the same `required` contract as the coordinator and the
  #   gateway (ADR-083), so a missing store fails all three services
  #   with ONE message naming ONE file, rather than bringing the
  #   trainer up in a disabled-by-config state.
  # - The trainer is gated behind the `training` profile so the
  #   default bring-up (coordinator/postgres/redis) is unaffected.
  #   Note: `training` is an INDEPENDENT profile, so a
  #   `--profile training` bring-up does not enable the `full` profile
  #   and therefore does not start the gateway or the UI. The trainer
  #   depends only on postgres, so this is coherent.
  # - AWARE_TRAINER_ENABLED defaults to 0 (kill switch off). Setting
  #   it to 1 + having MODAL_TOKEN_ID/SECRET set is the explicit opt-in.
  trainer:
    build:
      context: .
      dockerfile: Dockerfile.coordinator
      network: host
      # 2026-11-17 (t_091892e3): the rl-pipeline build args are GONE — the
      # image ships the repo's vendored copy, so there is no external tag to
      # pin. See the coordinator service above.
    # [date-redacted]: bumped to 0.4.5-phase4-rl-pipeline-from-internal-git.
    # 2026-11-17 (t_091892e3): rl-pipeline is now the repo's own vendored
    # copy (backend/heavy-think/src), COPYed into the image by the
    # Dockerfile — not cloned from an internal git server, not mounted from
    # the host. See the coordinator service above.
    # 2026-11-19 (t_3212eebd): bumped to 0.4.7-judge-family-deployed so the
    # trainer ships the same judge-family resolver as the coordinator.
    # 2026-11-19 (t_9be93b08): bumped to 0.4.8-served-model-deployed so the
    # trainer ships the same served-model judge contract as the coordinator.
    # 2026-11-19 (t_92708010): bumped to 0.4.9-config-guard-deployed so the
    # trainer ships the same config-time judge-independence guard as the
    # coordinator. The trainer reads the same judge configuration, so a
    # trainer without the guard would refuse a configuration the coordinator
    # accepts (and vice versa) -- the two must agree.
    image: aware-coordinator:0.4.9-config-guard-deployed
    container_name: aware-2-trainer
    profiles: ["training"]
    command: ["node", "src/trainer/index.js"]
    environment:
      - NODE_ENV=production
      - AWARE_TRAINER_ENABLED=${AWARE_TRAINER_ENABLED:-0}
      - AWARE_TRAINER_POLL_INTERVAL_SEC=${AWARE_TRAINER_POLL_INTERVAL_SEC:-300}
      - AWARE_TRAINER_MIN_PAIRS_PER_RUN=${AWARE_TRAINER_MIN_PAIRS_PER_RUN:-100}
      # AWARE_TRAINER_CONFIG default points at the in-image baked
      # config (see Dockerfile.coordinator COPY of
      # config/modal-training.json to /app/config/modal-training.json).
      # Operators can override with a custom path; the bind-mount
      # override at /opt/aware/config/... was removed (see
      # docs/audits/aware-2.0-trainer-env-audit-2026-06-13.md
      # BLOCKER-1).
      - AWARE_TRAINER_CONFIG=${AWARE_TRAINER_CONFIG:-/app/config/modal-training.json}
      - AWARE_TRAINER_WEIGHTS_DIR=${AWARE_TRAINER_WEIGHTS_DIR:-/opt/aware/weights/active}
      - AWARE_TRAINER_BASE_MODEL=${AWARE_TRAINER_BASE_MODEL:-unsloth/Qwen2.5-7B-Instruct-bnb-4bit}
      - AWARE_TRAINER_GPU_TYPE=${AWARE_TRAINER_GPU_TYPE:-A100-80GB}
      - AWARE_TRAINER_JOB_TIMEOUT_SEC=${AWARE_TRAINER_JOB_TIMEOUT_SEC:-14400}
      - AWARE_DB_HOST=postgres
      - AWARE_DB_PORT=5432
      - AWARE_DB_DATABASE=${POSTGRES_DB:-aware2}
      - AWARE_DB_USER=${POSTGRES_USER:-aware}
      - AWARE_DB_ENABLED=${AWARE_DB_ENABLED:-1}
      - AWARE_POSTGRES_PASSWORD=${AWARE_DB_PWD:-dev-only-pwd}
      # [date-redacted]: SEC-002. Bearer token
      # required for /coordinate + /budget/status. Fail-closed at boot in
      # NODE_ENV=production if unset or shorter than 32 chars (config.validate()).
      # The gateway must mirror this token in its outbound Authorization header.
      # ADR-083: supplied by the credential store (env_file below) - NOT
      # declared here, because `environment:` would override the store.
    # ADR-083: same credential-store contract as the coordinator and the
    # gateway - same path, same `required` default, so one missing store
    # fails all three services with ONE message naming ONE file.
    env_file:
      - path: ${AWARE_CREDENTIALS_FILE:-${HOME}/.aware/credentials.env}
        required: ${AWARE_CREDENTIALS_REQUIRED:-true}
    volumes:
      # The trainer's data dir is where it stages DPO dataset JSONLs
      # before they're uploaded to a Modal Volume. A named volume
      # survives across container restarts.
      - aware-2-trainer-data:/opt/aware/data
      # Phase 2.4: the trainer reads preference pairs from the same
      # named volume the coordinator writes them to (aware-2-pairs-data).
      # Without this mount, _fetchUnconsumedPairPaths would scan an
      # empty dir and the trainer would record a "cancelled" run with
      # "no unconsumed pair_path values". Now the trainer sees the
      # live pair files at /data/awareness-pairs/YYYY-MM-DD.jsonl.
      - aware-2-pairs-data:/data/awareness-pairs:ro
      # NOTE: config/modal-training.json is baked into the image at
      # /app/config/modal-training.json (see Dockerfile.coordinator).
      # An earlier revision of this compose file mounted the host
      # file to /opt/aware/config/modal-training.json via bind mount;
      # that bind conflicted with the named-volume mount point at
      # /opt/aware/, causing Docker to auto-create /opt/aware/config/
      # as a directory (which then returned EISDIR on readFile). The
      # in-image copy is the canonical source; operators who need to
      # hot-swap can override via AWARE_TRAINER_CONFIG env var.
      # See docs/audits/aware-2.0-trainer-env-audit-2026-06-13.md
      # BLOCKER-1.
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aware-2
    restart: unless-stopped
    # No healthcheck — the trainer is a poller, not a request-serving
    # service. liveness is verified by checking the container is up
    # + the trainer's process is alive (via docker ps / docker stats).

  # ─── UI (React control plane) ─────────────────────────────────────────
  # 2026-11-10 (scribe): the compliance UI had no running deployment in
  # the v2 stack. It pointed at http://localhost:8080/api — a port held by
  # an unrelated process on this host — and the v1 aware-frontend /
  # aware-backend containers were not running. Every API call failed and
  # the container substituted hardcoded mock scores (89/72/65/34/65),
  # which the UI rendered as live compliance figures.
  #
  # The UI is served by nginx on the aware-2 network and proxies /api to
  # the v2 gateway, which serves /api/compliance and /api/audit. The
  # React app's API base is same-origin relative ('/api'), so no
  # cross-origin configuration is needed.
  aware-2-ui:
    build:
      # Context is src/ui, not the repo root: src/ui/Dockerfile.ui copies
      # build/ and nginx.conf, both of which live under src/ui. With the
      # root as context those COPY paths resolve to /build and /nginx.conf
      # at the image root and the build fails with
      #   'failed to calculate checksum ... "/build": not found'.
      context: ./src/ui
      dockerfile: Dockerfile.ui
    container_name: aware-2-ui
    # ADR-083: the UI depends on `gateway`, which lives behind the "full"
    # profile. Without a profile of its own the UI was in the DEFAULT
    # service set, so `docker compose up -d` (no --profile) failed outright:
    #   service "aware-2-ui" depends on undefined service "gateway":
    #   invalid compose project
    # That broke the documented single-command bring-up (scripts/aware-up,
    # which README.md points at) independently of the credential defect.
    # Putting the UI in the same profile as the service it depends on makes
    # the profile sets coherent:
    #   default            -> coordinator, postgres, redis
    #   --profile full     -> + gateway, aware-2-ui
    #   --profile training -> + trainer
    profiles: ["full"]
    ports:
      - "${AWARE_UI_PORT:-8081}:8080"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - aware-2
    restart: unless-stopped

  # ─── Optional: live bring-up probe (development only) ──────
  # Use: docker compose -f docker-compose.coordinator.yml -p aware-2 --profile test up bring-up-probe
  # Hits the coordinator + ollama via the internal network and exits 0 on success.
  # The coordinator container has wget (alpine base); the ollama container has
  # neither curl nor wget, so we hit ollama via `docker exec ollama list` instead.
  bring-up-probe:
    image: curlimages/curl:8.10.1
    container_name: aware-2-bring-up-probe
    profiles: ["test"]
    depends_on:
      coordinator:
        condition: service_healthy
    networks:
      - aware-2
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo '--- coordinator /version ---'
        curl -sS http://coordinator:8080/version
        echo
        echo '--- coordinator /health ---'
        curl -sS http://coordinator:8080/health
        echo
        echo 'BRING-UP-OK'
